<div class="login-container">
    <h2>Login</h2>

    <p *ngIf="loginError" class="error-message">{{ loginError }}</p>

    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <div class="form-group">
        <label for="username">Email:</label>
        <input id="username" type="email" formControlName="username" placeholder="Enter your email" />
        <small *ngIf="username?.invalid && username?.touched" class="error">
          Valid email is required.
        </small>
      </div>
  
      <div class="form-group">
        <label for="password">Password:</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter your password" />
        <small *ngIf="password?.invalid && password?.touched" class="error">
          Password is required.
        </small>
      </div>
  
      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    
    </form>
  </div>
